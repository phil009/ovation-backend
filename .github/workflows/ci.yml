# Checks every push and pull request to staging and main.
# The host only deploys a commit after these checks pass, so a broken build never goes live.
name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ovation
          POSTGRES_PASSWORD: ovation_ci
          POSTGRES_DB: ovation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ovation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ovation:ovation_ci@localhost:5432/ovation
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      PORT: "5000"
      OBSERVE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads the version from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm build
      - run: pnpm exec prisma migrate deploy

      - name: Start the API
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:5000/api/health && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat api.log; exit 1

      - name: Smoke test
        run: node scripts/smoke.mjs

      - name: API log (on failure)
        if: failure()
        run: cat api.log

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
