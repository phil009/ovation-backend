# Render Blueprint for the Ovation API. Spec: https://render.com/docs/blueprint-spec
#
# NOW (no customers yet, $0/month): staging only.
#   staging  branch `staging` -> https://ovation-api-staging.onrender.com  (frontend development)
#   - Render free web service: sleeps after 15 min idle, ~1 min to wake.
#   - Database: NOT on Render (free Render Postgres is deleted after 30 days). Paste the connection
#     string of a free Neon project (https://neon.tech, region AWS Europe (Frankfurt), the direct,
#     non-pooled string) as DATABASE_URL when Render asks.
#
# LATER (about two weeks before the first real event): uncomment the production section below.
# It needs a card on Render (an always-on instance plus a paid database with backups).
#
# Deploys happen automatically after GitHub CI passes on the branch. Database migrations run when
# the container starts (see Dockerfile). `sync: false` values are asked for once, when the Blueprint
# is first applied; change them later under the service's Environment tab.

services:
  # ---------- staging ----------
  - type: web
    name: ovation-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    branch: staging
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string, e.g. postgresql://user:pass@ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. http://localhost:3000 (add the staging frontend URL later, comma-separated)
      - key: TRUST_PROXY
        value: "1"
      - key: DOCS_ENABLED
        value: "true"
      - key: SDK_DOWNLOAD_ENABLED
        value: "true" # the frontend repo pulls its SDK from staging
      - key: OBSERVE_SERVICE_ID
        value: ovation-api-staging
      - key: OBSERVE_APP_KEY
        sync: false # optional: leave empty to send nothing to Observe
      - key: OBSERVE_APP_SECRET
        sync: false

  # ---------- production (paid: enable before the first real event) ----------
  # - type: web
  #   name: ovation-api
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   region: frankfurt
  #   plan: 0.5c-512mb # smallest always-on instance
  #   branch: main
  #   autoDeployTrigger: checksPass
  #   healthCheckPath: /api/health
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
