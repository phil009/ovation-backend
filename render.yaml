  #         name: ovation-db
  #         property: connectionString
  #     - key: JWT_ACCESS_SECRET
  #       generateValue: true
  #     - key: CORS_ORIGINS
  #       sync: false # the production frontend URL
  #     - key: TRUST_PROXY
  #       value: "1"
  #     - key: DOCS_ENABLED
  #       value: "false"
  #     - key: SDK_DOWNLOAD_ENABLED
  #       value: "false"
  #     - key: OBSERVE_SERVICE_ID
  #       value: ovation-api
  #     - key: OBSERVE_APP_KEY
  #       sync: false
  #     - key: OBSERVE_APP_SECRET
  #       sync: false

